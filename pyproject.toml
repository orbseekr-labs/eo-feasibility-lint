[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eo-feasibility-lint"
version = "0.1.0"
description = "Deterministic, offline linter for Earth observation mission feasibility requirements"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "OrbSeekr Labs" }]
keywords = ["earth-observation", "remote-sensing", "linter", "sentinel", "landsat"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: GIS",
]

# Runtime dependency surface is deliberately minimal. Adding anything here
# requires changing the frozen specification first.
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/orbseekr-labs/eo-feasibility-lint"
Source = "https://github.com/orbseekr-labs/eo-feasibility-lint"
Issues = "https://github.com/orbseekr-labs/eo-feasibility-lint/issues"

[project.scripts]
eo-feasibility-lint = "eo_feasibility_lint.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eo_feasibility_lint"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "schemas", "examples", "benchmark", "README.md", "SPECIFICATION.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
