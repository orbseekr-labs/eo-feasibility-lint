# Static mission capability catalog for eo-feasibility-lint v0.1.
#
# This file is the ONLY source of mission facts at runtime. It is never fetched,
# refreshed, or extended at runtime. Every capability consumed by a rule cites at
# least one first-party source id from sources.yaml via `capability_sources`.
#
# Band families are deliberate abstractions, not individual instrument bands.
# A band family that is absent from a mission's `bands` map is treated as
# unavailable.
#
# `default_multispectral_gsd_m` is explicit catalog data, not a derived value.
# It is the resolution used when an optical GSD requirement names no specific
# spectral family. It is never inferred from band ordering or from the minimum
# band resolution, and panchromatic never contributes to it.
#
# `night_support` is resolved per band family with this chain:
#   1. an exact band-family key (e.g. `thermal_ir`)
#   2. the family's group key (`reflected_optical`, `thermal_ir`, `c_band_sar`)
# There is no implicit default. Every AVAILABLE band family must resolve
# explicitly to true, false or occasional; catalog integrity validation fails
# otherwise. Missing night-support metadata is a catalog defect, never evidence
# that a mission lacks the capability.
#
# `modality_inventory_source_ids` and `band_inventory_source_ids` designate the
# sources that are authoritative for the COMPLETE modality and band inventory of
# a mission. Negative-capability findings ("this mission has no thermal band")
# cite them. There is no generic mission-level provenance fallback.

