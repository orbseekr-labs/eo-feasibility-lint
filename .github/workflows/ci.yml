name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Installed CLI smoke test
        run: |
          set -euo pipefail

          # A clean install of the built wheel must ship the catalog data.
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install .
          cd /tmp

          /tmp/smoke/bin/eo-feasibility-lint --version
          /tmp/smoke/bin/eo-feasibility-lint list-missions
          /tmp/smoke/bin/eo-feasibility-lint show-mission sentinel-1-iw
          /tmp/smoke/bin/eo-feasibility-lint rules

          # The definition-of-done example must fail, and say why.
          set +e
          /tmp/smoke/bin/eo-feasibility-lint check \
            "$GITHUB_WORKSPACE/examples/impossible-thermal-sentinel2.yaml" > report.txt
          status=$?
          set -e
          test "$status" -eq 1
          grep -q "Verdict: FAIL" report.txt
          grep -q "EFL202" report.txt
          grep -q "esa-sentiwiki-s2-mission" report.txt

          # A passing example exits 0 and stays byte-identical across runs.
          /tmp/smoke/bin/eo-feasibility-lint check \
            "$GITHUB_WORKSPACE/examples/sentinel1-all-weather.yaml" --format json > first.json
          /tmp/smoke/bin/eo-feasibility-lint check \
            "$GITHUB_WORKSPACE/examples/sentinel1-all-weather.yaml" --format json > second.json
          cmp first.json second.json
